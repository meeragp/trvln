name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - master
      - claude/trusting-keller-ORjYy
      - claude/friendly-maxwell-h0637h
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" makes the action look up the newest release via
          # GitHub's API, which is rate limited on shared runners and failed a
          # deploy. Bump this deliberately.
          version: 3.1.0

      # Migrations first so the functions never run against a missing table.
      # Requires the SUPABASE_DB_PASSWORD secret (the database password from
      # Supabase dashboard → Project Settings → Database); skips with a
      # warning if it isn't configured.
      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_DB_PASSWORD secret not set — skipping db push. Run 'supabase db push' manually to apply migrations."
            exit 0
          fi
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --remote --yes

      # Deploys every function folder under supabase/functions (skipping
      # _shared and anything else starting with "_"), so a new function is
      # picked up without editing this file. Per-function settings such as
      # verify_jwt come from supabase/config.toml.
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue ;; esac
            [ -f "$dir/index.ts" ] || continue
            echo "::group::Deploy $name"
            supabase functions deploy "$name" --remote="$PROJECT_REF" --yes
            echo "::endgroup::"
          done
